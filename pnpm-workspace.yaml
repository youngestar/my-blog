packages:
  - "."

allowBuilds:
  esbuild: true
  "@parcel/watcher": true

peerDependencyRules:
  allowedVersions:
    astro: "^7.0.0"

overrides:
  astro: "^7.2.0"
  tar: "^7.5.21"
  svgo: "^3.3.4"
  undici: "^7.29.0"
  postcss: "^8.5.23"
  nanoid: "^3.3.17"
  sharp: "^0.35.3"
  immutable: "^5.1.8"
  fast-uri: "^3.1.5"
  "picomatch@2": "2.3.2"
  "picomatch@4": "4.0.4"
  browserslist: ">=4.28.7"
  deepmerge-ts: ">=8.0.0"

# extract-zip has no patched npm release (latest is 2.0.1). It is only used
# by @iconify/tools at build time, not for extracting untrusted archives.
auditConfig:
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv

onlyBuiltDependencies:
  - esbuild
  - "@parcel/watcher"
